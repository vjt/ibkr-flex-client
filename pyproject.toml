[project]
name = "ibkr-flex-client"
version = "0.1.0"
description = "Minimal async client for Interactive Brokers FlexQuery Web Service"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marcello Barnaba", email = "vjt@openssl.it" }]
requires-python = ">=3.12"
keywords = ["ibkr", "interactive-brokers", "flexquery", "async", "aiohttp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/vjt/ibkr-flex-client"
Repository = "https://github.com/vjt/ibkr-flex-client"
Issues = "https://github.com/vjt/ibkr-flex-client/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 5
